<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}스마트 실적관리{% endblock %} · ETNERS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="brand">ETNERS <span>실적관리 대시보드</span></div>
            <nav class="nav-links">
                <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">대시보드</a>
                <a href="{{ url_for('contracts_list') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('contract') }}">계약 관리</a>
                {% if user.role == 'admin' %}
                <a href="{{ url_for('admin_targets') }}" class="{{ 'active' if request.endpoint == 'admin_targets' }}">목표 설정</a>
                <a href="{{ url_for('admin_users') }}" class="{{ 'active' if request.endpoint == 'admin_users' }}">사용자 관리</a>
                {% endif %}
            </nav>
            <div class="user-box">
                <span class="user-name">{{ user.display_name }}</span>
                <span class="role-badge role-{{ user.role }}">{{ '관리자' if user.role == 'admin' else user.department }}</span>
                <form action="{{ url_for('logout') }}" method="post">
                    <button type="submit" class="logout-btn">로그아웃</button>
                </form>
            </div>
        </header>
        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
